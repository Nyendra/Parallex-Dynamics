<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#00f0ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Badge Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>
  
  <!-- Subtle Cyan Border -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Sci-Fi Corner Registration Accents -->
  <path d="M3 7.5V3H7.5" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M24.5 3H29V7.5" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M3 24.5V29H7.5" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M24.5 29H29V24.5" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Paradallax Double Chevron Motif -->
  <g filter="url(#glow)">
    <path d="M8.5 7.5L17 16L8.5 24.5" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 7.5L24.5 16L16 24.5" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
